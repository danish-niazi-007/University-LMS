{% extends "base.html" %}

{% block title %}
Create Course Offering
{% endblock %}

{% block content %}

<h1>Create Course Offering</h1>

<h2>{{ hod.department.name }}</h2>

<hr>

{% if error %}
    <p style="color:red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <div>
        <label>
            Course:
        </label>

        <select name="course" required>

            <option value="">
                Select Course
            </option>

            {% for course in courses %}

                <option value="{{ course.id }}">
                    {{ course.code }} -
                    {{ course.name }}
                    (Semester {{ course.semester }})
                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label>
            Teacher:
        </label>

        <select name="teacher" required>

            <option value="">
                Select Teacher
            </option>

            {% for teacher in teachers %}

                <option value="{{ teacher.id }}">
                    {{ teacher.user.get_full_name|default:teacher.user.username }}
                    -
                    {{ teacher.employee_id }}
                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label>
            Academic Year:
        </label>

        <input
            type="text"
            name="academic_year"
            placeholder="2026-27"
            required
        >
    </div>

    <br>

    <button type="submit">
        Create Offering
    </button>

</form>

<br>

<a href="{% url 'hod_course_offerings' %}">
    ← Back to Course Offerings
</a>

{% endblock %}
